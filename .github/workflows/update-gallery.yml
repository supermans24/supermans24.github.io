name: 시공사례 자동 갱신

on:
  schedule:
    - cron: "30 23 * * *"   # 매일 08:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 블로그 새 글 수집
        run: python scripts/update_gallery.py

      - name: 변경 시 커밋·배포
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "supermans-bot"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "🤖 시공사례 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          else
            echo "새 글 없음"
          fi
